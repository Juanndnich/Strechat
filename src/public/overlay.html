<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>strechat - OBS Overlay</title>
  <link rel="icon" type="image/png" href="icons/icon.png">
  <link rel="stylesheet" href="css/poppins.css">
  <style id="overlay-custom-styles">
    :root {
      --overlay-bg: rgba(15, 17, 26, 0.85);
      --overlay-border: 1px solid rgba(255, 255, 255, 0.12);
      --overlay-border-radius: 12px;
      --overlay-font: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --overlay-text-color: #f1f5f9;
      --overlay-name-color: #38bdf8;
      --overlay-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      --overlay-backdrop: blur(8px);
      --overlay-font-size: 13px;
      --overlay-avatar-size: 32px;
      --overlay-text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: transparent !important;
      font-family: var(--overlay-font);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
    }

    /* Container for chat stream */
    .overlay-feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 480px;
      pointer-events: none;
    }

    /* Chat bubble */
    .overlay-item {
      background: var(--overlay-bg);
      backdrop-filter: var(--overlay-backdrop);
      -webkit-backdrop-filter: var(--overlay-backdrop);
      border: var(--overlay-border);
      border-radius: var(--overlay-border-radius);
      padding: 8px 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: var(--overlay-text-color);
      box-shadow: var(--overlay-shadow);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .anim-pop {
      animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .anim-slide {
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .anim-fade {
      animation: fadeIn 0.35s ease;
    }

    .anim-bounce {
      animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .overlay-avatar {
      width: var(--overlay-avatar-size);
      height: var(--overlay-avatar-size);
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
    }

    .overlay-avatar-placeholder {
      width: var(--overlay-avatar-size);
      height: var(--overlay-avatar-size);
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #f43f5e);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }

    .overlay-body {
      flex: 1;
      min-width: 0;
    }

    .overlay-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .overlay-nickname {
      font-size: 12px;
      font-weight: 600;
      color: var(--overlay-name-color);
      text-shadow: var(--overlay-text-shadow);
    }

    .overlay-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-mod {
      background: rgba(16, 185, 129, 0.3);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .overlay-text {
      font-size: var(--overlay-font-size);
      line-height: 1.4;
      color: var(--overlay-text-color);
      word-break: break-word;
      text-shadow: var(--overlay-text-shadow);
    }

    /* Gift Highlight */
    .overlay-item.overlay-gift {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.28), rgba(244, 63, 94, 0.28));
      border: 1.5px solid rgba(245, 158, 11, 0.65);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
      animation: giftBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .overlay-gift .overlay-nickname {
      color: #fbbf24;
    }

    .overlay-gift .gift-label {
      color: #fef08a;
      font-weight: 600;
    }

    .combo-badge {
      background: linear-gradient(135deg, #00f0ff, #a855f7);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 9999px;
      margin-left: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    /* ==========================================================================
       Pixel Overlay Theme (Custom Streamer Designs: Cat Chat & Crown Gift)
       ========================================================================== */
    .pixel-overlay-banner {
      position: relative;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      pointer-events: none;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .pixel-banner-bg {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
    }

    /* Comment Banner Content */
    .pixel-comment-content {
      position: absolute;
      left: 31%;
      top: 36%;
      width: 52%;
      height: 56%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      padding: 0 4px;
    }

    .pixel-comment-author {
      font-family: var(--overlay-font);
      font-weight: 700;
      font-size: 13px;
      color: #2b1747;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pixel-comment-msg {
      font-family: var(--overlay-font);
      font-weight: 600;
      font-size: 11.5px;
      color: #432168;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
    }

    /* Gift Banner Content */
    .pixel-gift-avatar-wrap {
      position: absolute;
      left: 6.8%;
      top: 25.5%;
      width: 21%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.25);
    }

    .pixel-gift-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .pixel-gift-avatar-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #00f0ff, #a855f7);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      border-radius: 50%;
    }

    .pixel-gift-content {
      position: absolute;
      left: 30.5%;
      top: 38%;
      width: 48%;
      height: 52%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      padding: 0 4px;
    }

    .pixel-gift-author {
      font-family: var(--overlay-font);
      font-weight: 700;
      font-size: 13px;
      color: #2b1747;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px;
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .pixel-gift-info {
      font-family: var(--overlay-font);
      font-weight: 600;
      font-size: 11px;
      color: #4a2174;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pixel-diamond-tag {
      background: #fdf2f8;
      color: #db2777;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 9999px;
      border: 1px solid #f472b6;
      font-size: 10px;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(14px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-35px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.8); }
      60% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes giftBounce {
      0% { opacity: 0; transform: scale(0.85); }
      50% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="overlay-feed" id="overlay-feed"></div>

  <script>
    (function () {
      const feed = document.getElementById('overlay-feed');
      const params = new URLSearchParams(window.location.search);

      // Parse configuration from URL query params
      const theme = params.get('theme') || 'pixel';
      const font = params.get('font');
      const bg = params.get('bg');
      const textColor = params.get('textColor');
      const nameColor = params.get('nameColor');
      const animType = params.get('anim') || 'pop';
      const fadeDuration = params.get('fade') !== null ? Math.max(0, parseInt(params.get('fade'), 10)) : 12;
      const hideAvatar = params.get('hideAvatar') === '1' || params.get('hideAvatar') === 'true';
      const hideBadges = params.get('hideBadges') === '1' || params.get('hideBadges') === 'true';
      const fontSize = params.get('size') ? `${parseInt(params.get('size'), 10)}px` : '13px';
      const maxItems = params.get('maxItems') ? Math.min(25, Math.max(1, parseInt(params.get('maxItems'), 10))) : 7;

      // Apply Theme Presets
      const root = document.documentElement;
      function applyTheme(t) {
        switch (t) {
          case 'pixel':
            root.style.setProperty('--overlay-bg', 'transparent');
            root.style.setProperty('--overlay-border', 'none');
            root.style.setProperty('--overlay-shadow', 'none');
            root.style.setProperty('--overlay-backdrop', 'none');
            break;
          case 'pill':
            root.style.setProperty('--overlay-bg', 'rgba(18, 22, 34, 0.92)');
            root.style.setProperty('--overlay-border', '1px solid rgba(0, 240, 255, 0.35)');
            root.style.setProperty('--overlay-border-radius', '9999px');
            root.style.setProperty('--overlay-name-color', '#38bdf8');
            root.style.setProperty('--overlay-shadow', '0 4px 14px rgba(0, 0, 0, 0.35)');
            root.style.setProperty('--overlay-backdrop', 'blur(6px)');
            break;
          case 'glass':
            root.style.setProperty('--overlay-bg', 'rgba(255, 255, 255, 0.1)');
            root.style.setProperty('--overlay-border', '1px solid rgba(255, 255, 255, 0.25)');
            root.style.setProperty('--overlay-border-radius', '14px');
            root.style.setProperty('--overlay-name-color', '#00f0ff');
            root.style.setProperty('--overlay-shadow', '0 8px 32px rgba(0, 0, 0, 0.35)');
            root.style.setProperty('--overlay-backdrop', 'blur(16px)');
            break;
          case 'neon':
            root.style.setProperty('--overlay-bg', 'rgba(10, 10, 18, 0.94)');
            root.style.setProperty('--overlay-border', '1.5px solid #00f0ff');
            root.style.setProperty('--overlay-border-radius', '10px');
            root.style.setProperty('--overlay-name-color', '#a855f7');
            root.style.setProperty('--overlay-shadow', '0 0 16px rgba(0, 240, 255, 0.55), inset 0 0 10px rgba(0, 240, 255, 0.15)');
            root.style.setProperty('--overlay-backdrop', 'none');
            break;
          case 'borderless':
            root.style.setProperty('--overlay-bg', 'transparent');
            root.style.setProperty('--overlay-border', 'none');
            root.style.setProperty('--overlay-border-radius', '0');
            root.style.setProperty('--overlay-name-color', '#00f0ff');
            root.style.setProperty('--overlay-shadow', 'none');
            root.style.setProperty('--overlay-backdrop', 'none');
            root.style.setProperty('--overlay-text-shadow', '0 2px 4px rgba(0, 0, 0, 0.95), 0 0 3px #000');
            break;
          case 'classic':
          default:
            root.style.setProperty('--overlay-bg', 'rgba(15, 17, 26, 0.85)');
            root.style.setProperty('--overlay-border', '1px solid rgba(255, 255, 255, 0.12)');
            root.style.setProperty('--overlay-border-radius', '12px');
            root.style.setProperty('--overlay-name-color', '#00f0ff');
            root.style.setProperty('--overlay-shadow', '0 4px 15px rgba(0, 0, 0, 0.4)');
            root.style.setProperty('--overlay-backdrop', 'blur(8px)');
            break;
        }
      }

      applyTheme(theme);

      // Overrides
      if (bg) root.style.setProperty('--overlay-bg', bg);
      if (textColor) root.style.setProperty('--overlay-text-color', textColor);
      if (nameColor) root.style.setProperty('--overlay-name-color', nameColor);
      if (fontSize) root.style.setProperty('--overlay-font-size', fontSize);

      // Safe Font Family Loader
      const allowedFonts = ['Poppins', 'Montserrat', 'Roboto', 'Inter', 'Bangers', 'Ubuntu', 'Lato', 'Oswald'];
      if (font && allowedFonts.includes(font)) {
        if (font !== 'Poppins') {
          const fontLink = document.createElement('link');
          fontLink.rel = 'stylesheet';
          fontLink.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(font)}:wght@400;600;700&display=swap`;
          document.head.appendChild(fontLink);
        }
        root.style.setProperty('--overlay-font', `'${font}', sans-serif`);
      }

      // Animation class
      const animClass = `anim-${['pop', 'slide', 'fade', 'bounce'].includes(animType) ? animType : 'pop'}`;

      // Helper for HTML escape
      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // WebSocket Connection
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws`;

      function connect() {
        const ws = new WebSocket(wsUrl);

        ws.onmessage = (event) => {
          try {
            const packet = JSON.parse(event.data);
            if (packet.type === 'chat') {
              renderChat(packet.data);
            } else if (packet.type === 'gift') {
              renderGift(packet.data);
            }
          } catch (e) {}
        };

        ws.onclose = () => setTimeout(connect, 2000);
      }

      function renderChat(chat) {
        if (theme === 'pixel') {
          renderPixelChat(chat);
        } else {
          renderStandardChat(chat);
        }
      }

      function renderGift(data) {
        if (theme === 'pixel') {
          renderPixelGift(data);
        } else {
          renderStandardGift(data);
        }
      }

      function renderPixelChat(chat) {
        const item = document.createElement('div');
        item.className = `pixel-overlay-banner pixel-comment-banner ${animClass}`;
        const modBadge = (!hideBadges && chat.isModerator)
          ? `<span class="overlay-badge badge-mod" style="font-size: 8px; padding: 0 4px; border-radius: 2px;">MOD</span>`
          : '';

        item.innerHTML = `
          <img class="pixel-banner-bg" src="images/overlay-comment.png" alt="" />
          <div class="pixel-comment-content">
            <div class="pixel-comment-author">
              <span>${escapeHtml(chat.nickname)}</span>
              ${modBadge}
            </div>
            <div class="pixel-comment-msg">${escapeHtml(chat.comment)}</div>
          </div>
        `;
        addItem(item);
      }

      function renderPixelGift(data) {
        const item = document.createElement('div');
        item.className = `pixel-overlay-banner pixel-gift-banner ${animClass}`;

        let avatarHtml = '';
        if (!hideAvatar) {
          avatarHtml = data.profilePictureUrl && data.profilePictureUrl.startsWith('http')
            ? `<img src="${escapeHtml(data.profilePictureUrl)}" alt="">`
            : `<div class="pixel-gift-avatar-placeholder">${(data.nickname || 'G').charAt(0).toUpperCase()}</div>`;
        }

        const combo = data.repeatCount > 1
          ? `<span class="combo-badge">x${data.repeatCount}</span>`
          : '';

        const diamonds = data.diamonds !== undefined
          ? data.diamonds
          : ((data.gift?.diamondCount || 0) * (data.repeatCount || 1));

        const giftName = data.gift?.giftName || 'Gift';
        const giftImg = data.gift?.giftPictureUrl
          ? `<img src="${escapeHtml(data.gift.giftPictureUrl)}" style="width: 16px; height: 16px; object-fit: contain; vertical-align: middle;" alt="">`
          : '🎁';

        item.innerHTML = `
          <img class="pixel-banner-bg" src="images/overlay-gift.png" alt="" />
          ${avatarHtml ? `<div class="pixel-gift-avatar-wrap">${avatarHtml}</div>` : ''}
          <div class="pixel-gift-content">
            <div class="pixel-gift-author">
              <span>${escapeHtml(data.nickname)}</span>
              ${combo}
            </div>
            <div class="pixel-gift-info">
              <span>Mengirim <strong>${escapeHtml(giftName)}</strong></span>
              ${giftImg}
              <span class="pixel-diamond-tag">${diamonds} 💎</span>
            </div>
          </div>
        `;
        addItem(item);
      }

      function renderStandardChat(chat) {
        const item = document.createElement('div');
        item.className = `overlay-item ${animClass}`;

        let avatarHtml = '';
        if (!hideAvatar) {
          avatarHtml = chat.profilePictureUrl && chat.profilePictureUrl.startsWith('http')
            ? `<img class="overlay-avatar" src="${escapeHtml(chat.profilePictureUrl)}" alt="">`
            : `<div class="overlay-avatar-placeholder">${(chat.nickname || 'U').charAt(0).toUpperCase()}</div>`;
        }

        const badgeHtml = (!hideBadges && chat.isModerator)
          ? `<span class="overlay-badge badge-mod">MOD</span>`
          : '';

        item.innerHTML = `
          ${avatarHtml}
          <div class="overlay-body">
            <div class="overlay-header">
              <span class="overlay-nickname">${escapeHtml(chat.nickname)}</span>
              ${badgeHtml}
            </div>
            <div class="overlay-text">${escapeHtml(chat.comment)}</div>
          </div>
        `;

        addItem(item);
      }

      function renderStandardGift(data) {
        const item = document.createElement('div');
        item.className = `overlay-item overlay-gift ${animClass}`;

        let avatarHtml = '';
        if (!hideAvatar) {
          avatarHtml = data.profilePictureUrl && data.profilePictureUrl.startsWith('http')
            ? `<img class="overlay-avatar" src="${escapeHtml(data.profilePictureUrl)}" alt="">`
            : `<div class="overlay-avatar-placeholder">${(data.nickname || 'G').charAt(0).toUpperCase()}</div>`;
        }

        const combo = data.repeatCount > 1
          ? `<span class="combo-badge">x${data.repeatCount}</span>`
          : '';

        const diamonds = data.diamonds !== undefined
          ? data.diamonds
          : ((data.gift?.diamondCount || 0) * (data.repeatCount || 1));

        let giftImg = data.gift?.giftPictureUrl
          ? `<img src="${escapeHtml(data.gift.giftPictureUrl)}" style="width: 22px; height: 22px; vertical-align: middle; margin-left: 4px;" alt="">`
          : '🎁';

        item.innerHTML = `
          ${avatarHtml}
          <div class="overlay-body">
            <div class="overlay-header">
              <span class="overlay-nickname">${escapeHtml(data.nickname)}</span>
              <span class="overlay-badge" style="background: rgba(245, 158, 11, 0.3); color: #f59e0b; border: 1px solid #f59e0b;">GIFT</span>
            </div>
            <div class="overlay-text gift-label">
              Mengirim <strong>${escapeHtml(data.gift?.giftName || 'Gift')}</strong> (${diamonds} 💎) ${combo} ${giftImg}
            </div>
          </div>
        `;

        addItem(item);
      }

      function addItem(el) {
        feed.appendChild(el);

        // Keep maximum items
        while (feed.children.length > maxItems) {
          feed.removeChild(feed.firstElementChild);
        }

        // Auto fade out after duration (if fadeDuration > 0)
        if (fadeDuration > 0) {
          setTimeout(() => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(-10px)';
            setTimeout(() => el.remove(), 400);
          }, fadeDuration * 1000);
        }
      }

      connect();
    })();
  </script>
</body>
</html>
