<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>strechat - OBS Overlay</title>
  <link rel="icon" type="image/png" href="icons/icon.png">
  <link rel="stylesheet" href="css/poppins.css">
  <style id="overlay-custom-styles">
    :root {
      --overlay-bg: rgba(15, 17, 26, 0.85);
      --overlay-border: 1px solid rgba(255, 255, 255, 0.12);
      --overlay-border-radius: 12px;
      --overlay-font: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --overlay-text-color: #f1f5f9;
      --overlay-name-color: #38bdf8;
      --overlay-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      --overlay-backdrop: blur(8px);
      --overlay-font-size: 13px;
      --overlay-avatar-size: 32px;
      --overlay-text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: transparent !important;
      font-family: var(--overlay-font);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
    }

    /* Container for chat stream */
    .overlay-feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 480px;
      pointer-events: none;
    }

    /* Chat bubble */
    .overlay-item {
      background: var(--overlay-bg);
      backdrop-filter: var(--overlay-backdrop);
      -webkit-backdrop-filter: var(--overlay-backdrop);
      border: var(--overlay-border);
      border-radius: var(--overlay-border-radius);
      padding: 8px 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: var(--overlay-text-color);
      box-shadow: var(--overlay-shadow);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .anim-pop {
      animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .anim-slide {
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .anim-fade {
      animation: fadeIn 0.35s ease;
    }

    .anim-bounce {
      animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .overlay-avatar {
      width: var(--overlay-avatar-size);
      height: var(--overlay-avatar-size);
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
    }

    .overlay-avatar-placeholder {
      width: var(--overlay-avatar-size);
      height: var(--overlay-avatar-size);
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #f43f5e);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }

    .overlay-body {
      flex: 1;
      min-width: 0;
    }

    .overlay-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .overlay-nickname {
      font-size: 12px;
      font-weight: 600;
      color: var(--overlay-name-color);
      text-shadow: var(--overlay-text-shadow);
    }

    .overlay-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-mod {
      background: rgba(16, 185, 129, 0.3);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .overlay-text {
      font-size: var(--overlay-font-size);
      line-height: 1.4;
      color: var(--overlay-text-color);
      word-break: break-word;
      text-shadow: var(--overlay-text-shadow);
    }

    /* Gift Highlight */
    .overlay-item.overlay-gift {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.28), rgba(244, 63, 94, 0.28));
      border: 1.5px solid rgba(245, 158, 11, 0.65);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
      animation: giftBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .overlay-gift .overlay-nickname {
      color: #fbbf24;
    }

    .overlay-gift .gift-label {
      color: #fef08a;
      font-weight: 600;
    }

    .combo-badge {
      background: linear-gradient(135deg, #00f0ff, #a855f7);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 9999px;
      margin-left: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    /* ==========================================================================
       Pixel Overlay Theme (Custom Streamer Designs: Cat Chat & Crown Gift)
       ========================================================================== */
    .pixel-overlay-banner {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .pixel-banner-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(14px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-35px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.8); }
      60% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes giftBounce {
      0% { opacity: 0; transform: scale(0.85); }
      50% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="overlay-feed" id="overlay-feed"></div>

  <script>
    (function () {
      const feed = document.getElementById('overlay-feed');
      const params = new URLSearchParams(window.location.search);

      // Parse configuration from URL query params
      const theme = params.get('theme') || 'pixel';
      const font = params.get('font');
      const bg = params.get('bg');
      const textColor = params.get('textColor');
      const nameColor = params.get('nameColor');
      const animType = params.get('anim') || 'pop';
      const fadeDuration = params.get('fade') !== null ? Math.max(0, parseInt(params.get('fade'), 10)) : 12;
      const hideAvatar = params.get('hideAvatar') === '1' || params.get('hideAvatar') === 'true';
      const hideBadges = params.get('hideBadges') === '1' || params.get('hideBadges') === 'true';
      const fontSize = params.get('size') ? `${parseInt(params.get('size'), 10)}px` : '13px';
      const maxItems = params.get('maxItems') ? Math.min(25, Math.max(1, parseInt(params.get('maxItems'), 10))) : 7;

      // Apply Theme Presets
      const root = document.documentElement;
      function applyTheme(t) {
        switch (t) {
          case 'pixel':
            root.style.setProperty('--overlay-bg', 'transparent');
            root.style.setProperty('--overlay-border', 'none');
            root.style.setProperty('--overlay-shadow', 'none');
            root.style.setProperty('--overlay-backdrop', 'none');
            break;
          case 'pill':
            root.style.setProperty('--overlay-bg', 'rgba(18, 22, 34, 0.92)');
            root.style.setProperty('--overlay-border', '1px solid rgba(0, 240, 255, 0.35)');
            root.style.setProperty('--overlay-border-radius', '9999px');
            root.style.setProperty('--overlay-name-color', '#38bdf8');
            root.style.setProperty('--overlay-shadow', '0 4px 14px rgba(0, 0, 0, 0.35)');
            root.style.setProperty('--overlay-backdrop', 'blur(6px)');
            break;
          case 'glass':
            root.style.setProperty('--overlay-bg', 'rgba(255, 255, 255, 0.1)');
            root.style.setProperty('--overlay-border', '1px solid rgba(255, 255, 255, 0.25)');
            root.style.setProperty('--overlay-border-radius', '14px');
            root.style.setProperty('--overlay-name-color', '#00f0ff');
            root.style.setProperty('--overlay-shadow', '0 8px 32px rgba(0, 0, 0, 0.35)');
            root.style.setProperty('--overlay-backdrop', 'blur(16px)');
            break;
          case 'neon':
            root.style.setProperty('--overlay-bg', 'rgba(10, 10, 18, 0.94)');
            root.style.setProperty('--overlay-border', '1.5px solid #00f0ff');
            root.style.setProperty('--overlay-border-radius', '10px');
            root.style.setProperty('--overlay-name-color', '#a855f7');
            root.style.setProperty('--overlay-shadow', '0 0 16px rgba(0, 240, 255, 0.55), inset 0 0 10px rgba(0, 240, 255, 0.15)');
            root.style.setProperty('--overlay-backdrop', 'none');
            break;
          case 'borderless':
            root.style.setProperty('--overlay-bg', 'transparent');
            root.style.setProperty('--overlay-border', 'none');
            root.style.setProperty('--overlay-border-radius', '0');
            root.style.setProperty('--overlay-name-color', '#00f0ff');
            root.style.setProperty('--overlay-shadow', 'none');
            root.style.setProperty('--overlay-backdrop', 'none');
            root.style.setProperty('--overlay-text-shadow', '0 2px 4px rgba(0, 0, 0, 0.95), 0 0 3px #000');
            break;
          case 'classic':
          default:
            root.style.setProperty('--overlay-bg', 'rgba(15, 17, 26, 0.85)');
            root.style.setProperty('--overlay-border', '1px solid rgba(255, 255, 255, 0.12)');
            root.style.setProperty('--overlay-border-radius', '12px');
            root.style.setProperty('--overlay-name-color', '#00f0ff');
            root.style.setProperty('--overlay-shadow', '0 4px 15px rgba(0, 0, 0, 0.4)');
            root.style.setProperty('--overlay-backdrop', 'blur(8px)');
            break;
        }
      }

      applyTheme(theme);

      // Overrides
      if (bg) root.style.setProperty('--overlay-bg', bg);
      if (textColor) root.style.setProperty('--overlay-text-color', textColor);
      if (nameColor) root.style.setProperty('--overlay-name-color', nameColor);
      if (fontSize) root.style.setProperty('--overlay-font-size', fontSize);

      // Safe Font Family Loader
      const allowedFonts = ['Poppins', 'Montserrat', 'Roboto', 'Inter', 'Bangers', 'Ubuntu', 'Lato', 'Oswald'];
      if (font && allowedFonts.includes(font)) {
        if (font !== 'Poppins') {
          const fontLink = document.createElement('link');
          fontLink.rel = 'stylesheet';
          fontLink.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(font)}:wght@400;600;700&display=swap`;
          document.head.appendChild(fontLink);
        }
        root.style.setProperty('--overlay-font', `'${font}', sans-serif`);
      }

      // Animation class
      const animClass = `anim-${['pop', 'slide', 'fade', 'bounce'].includes(animType) ? animType : 'pop'}`;

      // Helper for HTML escape
      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // WebSocket Connection
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws`;

      function connect() {
        const ws = new WebSocket(wsUrl);

        ws.onmessage = (event) => {
          try {
            const packet = JSON.parse(event.data);
            if (packet.type === 'chat') {
              renderChat(packet.data);
            } else if (packet.type === 'gift') {
              renderGift(packet.data);
            }
          } catch (e) {}
        };

        ws.onclose = () => setTimeout(connect, 2000);
      }

      function renderChat(chat) {
        if (theme === 'pixel') {
          renderPixelChat(chat);
        } else {
          renderStandardChat(chat);
        }
      }

      function renderGift(data) {
        if (theme === 'pixel') {
          renderPixelGift(data);
        } else {
          renderStandardGift(data);
        }
      }

      // SVG Generator for Custom Pixel Comment Banner (Cat & TikTok Crown)
      function buildCommentBannerSvg(chat, opts = {}) {
        const nickname = escapeHtml(chat.nickname || 'Pengguna');
        const comment = escapeHtml(chat.comment || '');
        const isMod = !opts.hideBadges && chat.isModerator;
        const modBadge = isMod
          ? `<span style="background: rgba(16, 185, 129, 0.25); color: #059669; border: 1px solid rgba(16, 185, 129, 0.5); font-size: 8.5px; font-weight: 700; padding: 1px 5px; border-radius: 4px; text-transform: uppercase;">MOD</span>`
          : '';

        return `
          <svg class="pixel-banner-svg" viewBox="0 0 460 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="comm-bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="55%" stop-color="#fcf8ff"/>
                <stop offset="100%" stop-color="#f3e8ff"/>
              </linearGradient>
              <linearGradient id="comm-pill" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#3b1d6e"/>
                <stop offset="100%" stop-color="#6b21a8"/>
              </linearGradient>
              <linearGradient id="comm-gold" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#fde047"/>
                <stop offset="50%" stop-color="#f59e0b"/>
                <stop offset="100%" stop-color="#d97706"/>
              </linearGradient>
              <filter id="comm-shadow" x="-8%" y="-15%" width="120%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
              </filter>
            </defs>

            <g filter="url(#comm-shadow)">
              <!-- Clouds / Bubbles at Left and Bottom -->
              <circle cx="36" cy="72" r="14" fill="#c4b5fd" stroke="#251842" stroke-width="3"/>
              <circle cx="48" cy="94" r="16" fill="#a7f3d0" stroke="#251842" stroke-width="3"/>
              <circle cx="82" cy="98" r="13" fill="#fed7aa" stroke="#251842" stroke-width="3"/>
              <circle cx="395" cy="98" r="12" fill="#bfdbfe" stroke="#251842" stroke-width="3"/>
              <circle cx="414" cy="90" r="14" fill="#fbcfe8" stroke="#251842" stroke-width="3"/>

              <!-- Main Banner Box -->
              <rect x="24" y="28" width="412" height="76" rx="18" fill="url(#comm-bg)" stroke="#251842" stroke-width="3.5" stroke-linejoin="round"/>

              <!-- Top Pill Header -->
              <rect x="145" y="19" width="112" height="18" rx="9" fill="url(#comm-pill)" stroke="#251842" stroke-width="2.5"/>
              <text x="201" y="31.5" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">💬 TikTok Chat ♥</text>

              <!-- Peeking Cat on Top Right -->
              <polygon points="340,28 348,6 360,26" fill="#ffffff" stroke="#251842" stroke-width="3" stroke-linejoin="round"/>
              <polygon points="344,25 349,12 356,24" fill="#f472b6"/>
              <polygon points="385,26 397,6 405,28" fill="#ffffff" stroke="#251842" stroke-width="3" stroke-linejoin="round"/>
              <polygon points="389,24 396,12 401,25" fill="#f472b6"/>
              <ellipse cx="372" cy="22" rx="24" ry="16" fill="#ffffff" stroke="#251842" stroke-width="3"/>
              <path d="M 360 21 Q 364 16 368 21" stroke="#251842" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <path d="M 376 21 Q 380 16 384 21" stroke="#251842" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <ellipse cx="358" cy="25" rx="3" ry="2" fill="#f9a8d4"/>
              <ellipse cx="386" cy="25" rx="3" ry="2" fill="#f9a8d4"/>
              <path d="M 370 24 Q 372 26 374 24" stroke="#ec4899" stroke-width="2" fill="none" stroke-linecap="round"/>
              <ellipse cx="352" cy="30" rx="6" ry="4" fill="#ffffff" stroke="#251842" stroke-width="2.5"/>
              <ellipse cx="392" cy="30" rx="6" ry="4" fill="#ffffff" stroke="#251842" stroke-width="2.5"/>
              <rect x="316" y="8" width="20" height="18" rx="6" fill="#ffffff" stroke="#251842" stroke-width="2"/>
              <path d="M 334,16 L 339,18 L 334,20" fill="#ffffff" stroke="#251842" stroke-width="2" stroke-linejoin="round"/>
              <text x="326" y="21" font-family="'Poppins', sans-serif" font-size="11" fill="#ec4899" text-anchor="middle" font-weight="900">♥</text>

              <!-- Left TikTok Circular Badge with Crown -->
              <circle cx="68" cy="66" r="23" fill="#0b0e14" stroke="#251842" stroke-width="3"/>
              <path d="M 72 56 L 72 70 A 5 5 0 1 1 67 65 A 5 5 0 0 1 70 65 L 70 54 L 75 54 A 8 8 0 0 0 78 59 L 78 56 A 6 6 0 0 1 72 56 Z" fill="#ff0055" transform="translate(1.2, 0.8)"/>
              <path d="M 72 56 L 72 70 A 5 5 0 1 1 67 65 A 5 5 0 0 1 70 65 L 70 54 L 75 54 A 8 8 0 0 0 78 59 L 78 56 A 6 6 0 0 1 72 56 Z" fill="#00f0ff" transform="translate(-1.2, -0.8)"/>
              <path d="M 72 56 L 72 70 A 5 5 0 1 1 67 65 A 5 5 0 0 1 70 65 L 70 54 L 75 54 A 8 8 0 0 0 78 59 L 78 56 A 6 6 0 0 1 72 56 Z" fill="#ffffff"/>

              <polygon points="54,49 52,36 60,43 68,33 76,43 84,36 82,49" fill="url(#comm-gold)" stroke="#251842" stroke-width="2.5" stroke-linejoin="round"/>
              <circle cx="68" cy="40" r="2.2" fill="#ef4444"/>
              <circle cx="57" cy="42" r="1.8" fill="#38bdf8"/>
              <circle cx="79" cy="42" r="1.8" fill="#38bdf8"/>
              <path d="M 50 30 Q 52 28 50 26 Q 48 28 50 30" fill="#fde047"/>
              <path d="M 85 32 Q 87 30 85 28 Q 83 30 85 32" fill="#fde047"/>
              <path d="M 82,78 C 82,75 79,73 77,75 C 75,73 72,75 72,78 C 72,82 77,85 77,85 C 77,85 82,82 82,78 Z" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
            </g>

            <!-- Message Content inside foreignObject -->
            <foreignObject x="104" y="38" width="316" height="56">
              <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; font-family: 'Poppins', sans-serif; overflow: hidden; box-sizing: border-box; padding-right: 8px;">
                <div style="font-weight: 700; font-size: 13px; color: #2d184c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; display: flex; align-items: center; gap: 6px;">
                  <span>${nickname}</span>
                  ${modBadge}
                </div>
                <div style="font-weight: 600; font-size: 11.5px; color: #432168; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; word-break: break-word; margin-top: 1px;">
                  ${comment}
                </div>
              </div>
            </foreignObject>
          </svg>
        `;
      }

      // SVG Generator for Custom Pixel Gift Banner (Crowned Avatar, Rainbow & TikTok)
      function buildGiftBannerSvg(data, opts = {}) {
        const nickname = escapeHtml(data.nickname || 'Donatur');
        const giftName = escapeHtml(data.gift?.giftName || 'Gift');
        const repeatCount = Number(data.repeatCount || 1);
        const diamonds = data.diamonds !== undefined
          ? data.diamonds
          : ((data.gift?.diamondCount || 0) * repeatCount);
        const clipId = `av-${Math.random().toString(36).slice(2, 8)}`;

        let avatarInner = '';
        if (!opts.hideAvatar && data.profilePictureUrl && data.profilePictureUrl.startsWith('http')) {
          avatarInner = `<image href="${escapeHtml(data.profilePictureUrl)}" x="44" y="42" width="48" height="48" preserveAspectRatio="xMidYMid slice"/>`;
        } else {
          const initial = escapeHtml((nickname.charAt(0) || 'G').toUpperCase());
          avatarInner = `
            <rect x="44" y="42" width="48" height="48" fill="url(#gift-av-grad)"/>
            <text x="68" y="72" font-family="'Poppins', sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">${initial}</text>
          `;
        }

        const comboHtml = repeatCount > 1
          ? `<span style="background: linear-gradient(135deg, #00f0ff, #a855f7); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 9999px; margin-left: 4px;">x${repeatCount}</span>`
          : '';

        const giftImg = data.gift?.giftPictureUrl
          ? `<img src="${escapeHtml(data.gift.giftPictureUrl)}" style="width: 16px; height: 16px; object-fit: contain; vertical-align: middle; margin: 0 3px;" alt="" />`
          : '🎁';

        return `
          <svg class="pixel-banner-svg" viewBox="0 0 460 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="gift-bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="50%" stop-color="#fdf4ff"/>
                <stop offset="100%" stop-color="#fae8ff"/>
              </linearGradient>
              <linearGradient id="rainbow-g" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="35%" stop-color="#facc15"/>
                <stop offset="70%" stop-color="#f472b6"/>
                <stop offset="100%" stop-color="#c084fc"/>
              </linearGradient>
              <linearGradient id="gift-gold" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#fde047"/>
                <stop offset="50%" stop-color="#f59e0b"/>
                <stop offset="100%" stop-color="#d97706"/>
              </linearGradient>
              <linearGradient id="gift-av-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#00f0ff"/>
                <stop offset="100%" stop-color="#a855f7"/>
              </linearGradient>
              <clipPath id="${clipId}">
                <circle cx="68" cy="66" r="22"/>
              </clipPath>
              <filter id="gift-shadow" x="-8%" y="-15%" width="120%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
              </filter>
            </defs>

            <g filter="url(#gift-shadow)">
              <!-- Rainbow Trail at Bottom -->
              <path d="M 40 92 Q 180 115 410 98" fill="none" stroke="url(#rainbow-g)" stroke-width="7" stroke-linecap="round"/>
              <path d="M 42 95 Q 180 118 408 101" fill="none" stroke="#251842" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

              <polygon points="380,98 382,93 387,95 383,99 385,104 380,101 376,104 378,99 374,95 379,93" fill="#facc15" stroke="#251842" stroke-width="1.5"/>
              <polygon points="42,88 44,84 48,85 45,89 47,93 42,91 38,93 40,89 37,85 41,84" fill="#f472b6" stroke="#251842" stroke-width="1.5"/>

              <!-- Main Banner Box -->
              <rect x="24" y="28" width="412" height="76" rx="18" fill="url(#gift-bg)" stroke="#251842" stroke-width="3.5" stroke-linejoin="round"/>

              <!-- Left Crowned Avatar Circle -->
              <circle cx="68" cy="66" r="24" fill="#ffffff" stroke="#251842" stroke-width="3.5"/>
              <g clip-path="url(#${clipId})">
                ${avatarInner}
              </g>

              <!-- Tilted Gold Crown on Avatar -->
              <g transform="translate(42, 22) rotate(-15 20 20)">
                <polygon points="8,26 6,12 16,19 26,8 36,19 46,12 44,26" fill="url(#gift-gold)" stroke="#251842" stroke-width="2.5" stroke-linejoin="round"/>
                <circle cx="26" cy="16" r="2.2" fill="#ef4444"/>
                <circle cx="14" cy="18" r="1.8" fill="#38bdf8"/>
                <circle cx="38" cy="18" r="1.8" fill="#38bdf8"/>
              </g>

              <path d="M 38 28 Q 40 26 38 24 Q 36 26 38 28" fill="#fde047"/>
              <path d="M 88 34 Q 90 32 88 30 Q 86 32 88 34" fill="#fde047"/>
              <polygon points="98,28 100,24 104,25 101,29 103,33 98,31 94,33 96,29 93,25 97,24" fill="#facc15" stroke="#251842" stroke-width="1.5"/>
              <path d="M 44,78 C 44,75 41,73 39,75 C 37,73 34,75 34,78 C 34,82 39,85 39,85 C 39,85 44,82 44,78 Z" fill="#ec4899" stroke="#ffffff" stroke-width="1.5"/>

              <!-- Right TikTok Badge with Streamers -->
              <circle cx="400" cy="66" r="22" fill="#0b0e14" stroke="#251842" stroke-width="3"/>
              <path d="M 404 56 L 404 70 A 5 5 0 1 1 399 65 A 5 5 0 0 1 402 65 L 402 54 L 407 54 A 8 8 0 0 0 410 59 L 410 56 A 6 6 0 0 1 404 56 Z" fill="#ff0055" transform="translate(1, 0.7)"/>
              <path d="M 404 56 L 404 70 A 5 5 0 1 1 399 65 A 5 5 0 0 1 402 65 L 402 54 L 407 54 A 8 8 0 0 0 410 59 L 410 56 A 6 6 0 0 1 404 56 Z" fill="#00f0ff" transform="translate(-1, -0.7)"/>
              <path d="M 404 56 L 404 70 A 5 5 0 1 1 399 65 A 5 5 0 0 1 402 65 L 402 54 L 407 54 A 8 8 0 0 0 410 59 L 410 56 A 6 6 0 0 1 404 56 Z" fill="#ffffff"/>

              <path d="M 390 42 Q 394 48 392 54" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
              <path d="M 406 38 Q 402 46 408 52" stroke="#f472b6" stroke-width="3.5" stroke-linecap="round" fill="none"/>
              <path d="M 382,46 C 382,44 380,42 378,44 C 376,42 374,44 374,46 C 374,49 378,52 378,52 C 378,52 382,49 382,46 Z" fill="#f43f5e" stroke="#251842" stroke-width="1.5"/>
              <polygon points="418,74 420,70 424,71 421,75 423,79 418,77 414,79 416,75 413,71 417,70" fill="#facc15" stroke="#251842" stroke-width="1.5"/>
            </g>

            <!-- Dynamic Gift Info inside foreignObject -->
            <foreignObject x="104" y="38" width="270" height="56">
              <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; font-family: 'Poppins', sans-serif; overflow: hidden; box-sizing: border-box;">
                <div style="font-weight: 700; font-size: 13.5px; color: #2d184c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; display: flex; align-items: center; gap: 6px;">
                  <span>${nickname}</span>
                  ${comboHtml}
                </div>
                <div style="font-weight: 600; font-size: 11.5px; color: #432168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; margin-top: 2px;">
                  <span>Mengirim <strong>${giftName}</strong></span>
                  ${giftImg}
                  <span style="background: #fdf2f8; color: #db2777; font-weight: 700; padding: 1px 6px; border-radius: 9999px; border: 1px solid #f472b6; font-size: 10px;">${diamonds} 💎</span>
                </div>
              </div>
            </foreignObject>
          </svg>
        `;
      }

      function renderPixelChat(chat) {
        const item = document.createElement('div');
        item.className = `pixel-overlay-banner ${animClass}`;
        item.innerHTML = buildCommentBannerSvg(chat, { hideBadges });
        addItem(item);
      }

      function renderPixelGift(data) {
        const item = document.createElement('div');
        item.className = `pixel-overlay-banner ${animClass}`;
        item.innerHTML = buildGiftBannerSvg(data, { hideAvatar });
        addItem(item);
      }

      function renderStandardChat(chat) {
        const item = document.createElement('div');
        item.className = `overlay-item ${animClass}`;

        let avatarHtml = '';
        if (!hideAvatar) {
          avatarHtml = chat.profilePictureUrl && chat.profilePictureUrl.startsWith('http')
            ? `<img class="overlay-avatar" src="${escapeHtml(chat.profilePictureUrl)}" alt="">`
            : `<div class="overlay-avatar-placeholder">${(chat.nickname || 'U').charAt(0).toUpperCase()}</div>`;
        }

        const badgeHtml = (!hideBadges && chat.isModerator)
          ? `<span class="overlay-badge badge-mod">MOD</span>`
          : '';

        item.innerHTML = `
          ${avatarHtml}
          <div class="overlay-body">
            <div class="overlay-header">
              <span class="overlay-nickname">${escapeHtml(chat.nickname)}</span>
              ${badgeHtml}
            </div>
            <div class="overlay-text">${escapeHtml(chat.comment)}</div>
          </div>
        `;

        addItem(item);
      }

      function renderStandardGift(data) {
        const item = document.createElement('div');
        item.className = `overlay-item overlay-gift ${animClass}`;

        let avatarHtml = '';
        if (!hideAvatar) {
          avatarHtml = data.profilePictureUrl && data.profilePictureUrl.startsWith('http')
            ? `<img class="overlay-avatar" src="${escapeHtml(data.profilePictureUrl)}" alt="">`
            : `<div class="overlay-avatar-placeholder">${(data.nickname || 'G').charAt(0).toUpperCase()}</div>`;
        }

        const combo = data.repeatCount > 1
          ? `<span class="combo-badge">x${data.repeatCount}</span>`
          : '';

        const diamonds = data.diamonds !== undefined
          ? data.diamonds
          : ((data.gift?.diamondCount || 0) * (data.repeatCount || 1));

        let giftImg = data.gift?.giftPictureUrl
          ? `<img src="${escapeHtml(data.gift.giftPictureUrl)}" style="width: 22px; height: 22px; vertical-align: middle; margin-left: 4px;" alt="">`
          : '🎁';

        item.innerHTML = `
          ${avatarHtml}
          <div class="overlay-body">
            <div class="overlay-header">
              <span class="overlay-nickname">${escapeHtml(data.nickname)}</span>
              <span class="overlay-badge" style="background: rgba(245, 158, 11, 0.3); color: #f59e0b; border: 1px solid #f59e0b;">GIFT</span>
            </div>
            <div class="overlay-text gift-label">
              Mengirim <strong>${escapeHtml(data.gift?.giftName || 'Gift')}</strong> (${diamonds} 💎) ${combo} ${giftImg}
            </div>
          </div>
        `;

        addItem(item);
      }

      function addItem(el) {
        feed.appendChild(el);

        // Keep maximum items
        while (feed.children.length > maxItems) {
          feed.removeChild(feed.firstElementChild);
        }

        // Auto fade out after duration (if fadeDuration > 0)
        if (fadeDuration > 0) {
          setTimeout(() => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(-10px)';
            setTimeout(() => el.remove(), 400);
          }, fadeDuration * 1000);
        }
      }

      connect();
    })();
  </script>
</body>
</html>
